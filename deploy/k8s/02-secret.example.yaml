# Template only. Do NOT apply this file and do NOT commit a filled copy.
#
# In the sovereign cluster these values come from the entity's managed secret
# store through an external-secrets or CSI driver, so the material never sits
# in git or in etcd as a plain Secret.
#
#   RASED_JWT_SECRET : python -c "import secrets;print(secrets.token_urlsafe(48))"
#   RASED_VAULT_KEY  : leave EMPTY in production.
#
# An empty vault key makes each pod mint its own ephemeral AES-256 key, so a
# restart cryptographically destroys every outstanding masking table and no
# key exists to be stolen or to have to rotate (FR-1.3).
apiVersion: v1
kind: Secret
metadata:
  name: rased-secrets
  namespace: rased
type: Opaque
stringData:
  RASED_JWT_SECRET: "REPLACE_ME"
  RASED_VAULT_KEY: ""
