apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rased-api
  namespace: rased
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rased-api
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      # Procurement load is bursty around deadlines; react quickly.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Retreat slowly. A pod removed mid-review loses its in-memory masking
      # table and any suspended transaction it was holding, so churn has a
      # real cost beyond the usual thrashing.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rased-api
  namespace: rased
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: rased-api
