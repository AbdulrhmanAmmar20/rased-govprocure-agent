apiVersion: v1
kind: Service
metadata:
  name: rased-api
  namespace: rased
  labels:
    app: rased-api
spec:
  type: ClusterIP
  selector:
    app: rased-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# The inference engine is addressed only from inside the namespace. It is
# deliberately a ClusterIP with no Ingress: nothing outside the cluster should
# be able to reach the model directly and bypass the masking gate.
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: rased
  labels:
    app: vllm
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
