apiVersion: apps/v1
kind: Deployment
metadata:
  name: rased-api
  namespace: rased
  labels:
    app: rased-api
spec:
  # Three replicas, not two: NFR-2.3 asks for 99.5% availability, and with two
  # replicas a single voluntary disruption during a node drain leaves one pod
  # carrying all traffic with no headroom.
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: rased-api
  template:
    metadata:
      labels:
        app: rased-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread across nodes so losing one node cannot take the service down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: rased-api
      containers:
        - name: api
          image: rased/govprocure-agent:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: rased-config
            - secretRef:
                name: rased-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          # Liveness checks the process only. A readiness-style probe here
          # would restart healthy pods whenever inference is unavailable,
          # turning a degradation the service is built to absorb into an
          # outage and a crash loop.
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          volumeMounts:
            - name: audit
              mountPath: /var/lib/rased/audit
            - name: vector
              mountPath: /var/lib/rased/chroma
            - name: tmp
              mountPath: /tmp
      volumes:
        # The audit trail must survive the pod. Every replica appends to its
        # own chain; see docs/architecture.md on consolidating them.
        - name: audit
          persistentVolumeClaim:
            claimName: rased-audit
        - name: vector
          emptyDir: {}
        # Required because the root filesystem is read-only.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rased-audit
  namespace: rased
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
  # The class must provide AES-256 encryption at rest (NFR-1.2).
  storageClassName: encrypted-ssd
