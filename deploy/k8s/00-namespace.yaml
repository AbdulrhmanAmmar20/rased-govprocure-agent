apiVersion: v1
kind: Namespace
metadata:
  name: rased
  labels:
    name: rased
    # Enforced Pod Security Standards. The workload runs unprivileged, so
    # "restricted" costs nothing here and stops a future manifest from
    # quietly relaxing it.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    data-classification: confidential
    data-residency: in-kingdom
